    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"

<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="navbar">
      <div class="logo">
        <a href="" class="logo">
          <img src="./WhatsApp_Image_2026-10-28_at_09.43.36-removebg-preview.png" alt=""  height="80px" width="80px">
          <!-- <span>GoKwik</span> -->
        </a>
      </div>
      <nav class="nav-link">
        <a href="">Home</a>
        <a href="">Shop</a>
        <a href="">About</a>
      </nav>
      <div class="nav-side">
        <div class="nav-cart">
          <a href="cart.html">
            <i class="fa-solid fa-cart-shopping"></i>
          </a>
          <span id="cart-count">0</span>
        </div>

        <div class="profile">
          <a href=""><i class="fa-solid fa-circle-user"></i></a>
        </div>
      </div>
    </header>


    <!-- !------ -->

    <div id="carouselExample" class="carousel carousel-overlay slide">
  <div class="carousel-inner rounded-5">
    <div class="carousel-item active">
      <img src="https://picsum.photos/1200/400/?1" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="https://picsum.photos/1200/400/?2" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="https://picsum.photos/1200/400/?3" class="d-block w-100" alt="...">
    </div>
  </div>
  <div class="carousel-overlay-controls">
    <div>
      <button class="btn-icon btn-sm btn-subtle theme-secondary" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
        <span class="carousel-icon-prev" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="btn-icon btn-sm btn-subtle theme-secondary" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
        <span class="carousel-icon-next" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>
  </div>
</div>

    <!-- !0--------- -->

    <h1>🛍️ Product Store</h1>

    <div class="controls">
      <input type="text" id="search" placeholder="Search products..." />

      <select id="category">
        <option value="all">All Categories</option>
      </select>

      <select id="sort">
        <option value="default">Sort By</option>
        <option value="low-high">Price: Low to High</option>
        <option value="high-low">Price: High to Low</option>
        <option value="rating">Rating: High to Low</option>
        <option value="az">Name: A to Z</option>
      </select>
    </div>

    <p id="status">Loading products...</p>

    <div id="products"></div>

    <script src="script.js"></script>
  </body>
</html>
